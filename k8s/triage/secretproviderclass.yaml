# Driver CSI de Key Vault con Workload Identity. Los valores no están en Git: se leen de Key Vault.
# `secretObjects` sincroniza los valores a un Secret de Kubernetes (existe mientras haya un pod que
# monte el volumen) para exponerlos como variables de entorno; es un compromiso documentado.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: triage-keyvault
  namespace: triage
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "${TRIAGE_WORKLOAD_CLIENT_ID}"
    keyvaultName: "${KV_NAME}"
    tenantId: "${AZURE_TENANT_ID}"
    objects: |
      array:
        - |
          objectName: db-password
          objectType: secret
        - |
          objectName: triage-api-key
          objectType: secret
        - |
          objectName: eventhubs-connection-string
          objectType: secret
  secretObjects:
    - secretName: triage-secrets
      type: Opaque
      data:
        - objectName: db-password
          key: DB_PASSWORD
        - objectName: triage-api-key
          key: TRIAGE_API_KEY
        - objectName: eventhubs-connection-string
          key: EVENTHUBS_CONNECTION_STRING
