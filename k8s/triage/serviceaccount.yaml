# Workload Identity: este ServiceAccount se federa con la identidad id-triage-<sufijo>
# (federated credential creado por Terraform con subject system:serviceaccount:triage:triage).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: triage
  namespace: triage
  annotations:
    azure.workload.identity/client-id: "${TRIAGE_WORKLOAD_CLIENT_ID}"
    azure.workload.identity/tenant-id: "${AZURE_TENANT_ID}"
  labels:
    azure.workload.identity/use: "true"
