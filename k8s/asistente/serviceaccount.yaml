# Workload Identity: este ServiceAccount se federa con la identidad id-asistente-<sufijo>
# (federated credential de Terraform con subject system:serviceaccount:asistente:asistente).
# La misma identidad lee Key Vault (CSI) y llama a Azure OpenAI (rol Cognitive Services OpenAI User).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: asistente
  namespace: asistente
  annotations:
    azure.workload.identity/client-id: "${ASISTENTE_WORKLOAD_CLIENT_ID}"
    azure.workload.identity/tenant-id: "${AZURE_TENANT_ID}"
  labels:
    azure.workload.identity/use: "true"
