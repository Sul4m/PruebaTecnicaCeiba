# Driver CSI de Key Vault con Workload Identity. Los valores no están en el repositorio: se leen de Key Vault.
# `secretObjects` sincroniza a un Secret de Kubernetes (existe mientras haya un pod montando el volumen)
# para exponerlos como variables de entorno; compromiso documentado igual que en Triage.
# No hay clave de Azure OpenAI: la autenticación es por Entra ID (Workload Identity).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: asistente-keyvault
  namespace: asistente
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "${ASISTENTE_WORKLOAD_CLIENT_ID}"
    keyvaultName: "${KV_NAME}"
    tenantId: "${AZURE_TENANT_ID}"
    objects: |
      array:
        - |
          objectName: asistente-api-key
          objectType: secret
        - |
          objectName: redis-password
          objectType: secret
        - |
          objectName: asistente-eventhubs-connection-string
          objectType: secret
  secretObjects:
    - secretName: asistente-secrets
      type: Opaque
      data:
        - objectName: asistente-api-key
          key: ASISTENTE_API_KEY
        - objectName: redis-password
          key: REDIS_PASSWORD
        - objectName: asistente-eventhubs-connection-string
          key: EVENTHUBS_CONNECTION_STRING
