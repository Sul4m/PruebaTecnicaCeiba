spring:
  application:
    name: triage-service
  reactor:
    context-propagation: auto
  jackson:
    deserialization:
      accept-float-as-int: false
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:triage}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:triage}
    user: ${DB_USER}
    password: ${DB_PASSWORD}

triage:
  security:
    api-key: ${TRIAGE_API_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,r2dbc
  tracing:
    sampling:
      probability: 1.0

logging:
  structured:
    format:
      console: ecs
