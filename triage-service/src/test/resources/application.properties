# El relay del outbox queda apagado en los tests de integración salvo en OutboxKafkaIntegrationTest,
# para que los contextos cacheados no compitan como varios relays sobre la misma base.
triage.outbox.enabled=false

# El escalamiento queda apagado salvo en los tests que lo activan explícitamente.
triage.escalation.enabled=false

# Cadencias cortas para el stream SSE de alertas.
triage.alertas.stream.poll-interval=100ms
triage.alertas.stream.heartbeat-interval=300ms
